[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "W",      # pycodestyle 警告
    "F",      # pyflakes
    "I",      # import 排序
    "B",      # bugbear：常见 bug 模式（裸 except 等）
    "ASYNC",  # 异步反模式：v1 的「同步 SDK 阻塞事件循环」会被此规则拦截
    "UP",     # pyupgrade
]
ignore = [
    # FastAPI 官方模式：依赖注入必须写在参数默认值里
    "B008",
]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    # frontend 为 v1 路线图 Week 1-2 交付物。
    # 上方 paths: ["frontend/**"] 过滤器已保证：前端落盘前本流水线不会触发，
    # 落盘后自动生效。注意：hashFiles 不能用于 job 级 if（GitHub 会报
    # Unrecognized named-value 并使整个 workflow 直接失败）。
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check (vue-tsc)
        run: npm run typecheck

      - name: Unit test (vitest)
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    needs: quality
    # 仅 main 分支推送镜像到 GHCR；PR 只做质量门禁（与 backend.yml 对齐）
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 要求镜像名全小写（与 backend.yml 同款坑：仓库名含大写）
      - name: Resolve image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/frontend" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.IMAGE }}:latest

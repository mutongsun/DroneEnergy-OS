name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  pull_request:
    paths: ["frontend/**"]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    # frontend 为 v1 路线图 Week 1-2 交付物。
    # 上方 paths: ["frontend/**"] 过滤器已保证：前端落盘前本流水线不会触发，
    # 落盘后自动生效。注意：hashFiles 不能用于 job 级 if（GitHub 会报
    # Unrecognized named-value 并使整个 workflow 直接失败）。
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check (vue-tsc)
        run: npm run typecheck

      - name: Unit test (vitest)
        run: npm run test

      - name: Build
        run: npm run build
